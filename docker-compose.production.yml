name: tempo-api-production

services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - tempo_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${TEMPO_API_IMAGE:?TEMPO_API_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - ${TEMPO_PRODUCTION_ENV_FILE:-/etc/tempo/production.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: '587'
      EMAIL_SECURE: 'false'
      EMAIL_REQUIRE_TLS: 'true'
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable-banking-private.key
    volumes:
      - type: bind
        source: ${ENABLE_BANKING_PRIVATE_KEY_HOST_PATH}
        target: /run/secrets/enable-banking-private.key
        read_only: true
    expose:
      - '3000'
    networks:
      - default
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${TEMPO_WEB_IMAGE:?TEMPO_WEB_IMAGE must be set}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - frontend
      - ingress
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  default: {}
  frontend:
    internal: true
  ingress: {}

volumes:
  tempo_production_postgres_data:
