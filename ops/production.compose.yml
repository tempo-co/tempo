name: tempo-api-production

# Every service drops all capabilities and cannot gain privileges; see "Container privileges" in ops/README.md.
x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - tempo_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${TEMPO_API_IMAGE:?TEMPO_API_IMAGE must be set}
    restart: unless-stopped
    # A uid of its own, set here by number so an image cannot choose root or the host user's uid (1000).
    # The banking key grants it access; see "Container privileges" in ops/README.md.
    user: '10001:10001'
    <<: *no-new-privileges
    cap_drop: [ALL]
    env_file:
      - ${TEMPO_PRODUCTION_ENV_FILE:-/etc/tempo/production.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: '587'
      EMAIL_SECURE: 'false'
      EMAIL_REQUIRE_TLS: 'true'
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable-banking-private.key
    volumes:
      - type: bind
        source: ${ENABLE_BANKING_PRIVATE_KEY_HOST_PATH}
        target: /run/secrets/enable-banking-private.key
        read_only: true
    expose:
      - '3000'
    networks:
      - default
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${TEMPO_WEB_IMAGE:?TEMPO_WEB_IMAGE must be set}
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    # The Nginx master starts as root and switches its workers to the nginx user.
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - frontend
      - ingress
      - tailscale
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  default: {}
  frontend:
    internal: true
  ingress: {}
  # Joins web and the Tailscale sidecar (ops/tailscale.compose.yml). The fixed subnet gives the sidecar a
  # static address outside the dynamic range, the only address web's Nginx trusts for X-Forwarded-For.
  tailscale:
    ipam:
      config:
        - subnet: 10.213.47.0/28
          gateway: 10.213.47.1
          ip_range: 10.213.47.8/29

volumes:
  tempo_production_postgres_data:
