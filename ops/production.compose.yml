name: wisp-production

# Every service drops all capabilities and cannot gain privileges; see "Container privileges" in ops/README.md.
x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - wisp_production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    # wisp_readonly reads banking:* keys and lists or counts key names; it cannot write, run scripts
    # or read sessions. See "Read-only Redis access" in ops/README.md.
    command:
      [
        'redis-server',
        '--user',
        'wisp_readonly',
        'on',
        'nopass',
        'resetchannels',
        '%R~banking:*',
        '-@all',
        '+@read',
        '-@dangerous',
        '+scan',
        '+dbsize',
        '+ping',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${TEMPO_API_IMAGE:?TEMPO_API_IMAGE must be set}
    restart: unless-stopped
    # A uid of its own, set here by number so an image cannot choose root or the host user's uid (1000).
    # The banking key grants it access; see "Container privileges" in ops/README.md.
    user: '10001:10001'
    <<: *no-new-privileges
    cap_drop: [ALL]
    env_file:
      - ${WISP_PRODUCTION_ENV_FILE:-/etc/wisp/production.env}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      # Scaleway Transactional Email; user and password (project ID, API secret key) are in the env file.
      EMAIL_HOST: smtp.tem.scaleway.com
      EMAIL_PORT: '587'
      EMAIL_SECURE: 'false'
      EMAIL_REQUIRE_TLS: 'true'
      EMAIL_REPLY_TO: support@wispmoney.com
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable-banking-private.key
    volumes:
      - type: bind
        source: ${ENABLE_BANKING_PRIVATE_KEY_HOST_PATH}
        target: /run/secrets/enable-banking-private.key
        read_only: true
    expose:
      - '3000'
    networks:
      - default
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${TEMPO_WEB_IMAGE:?TEMPO_WEB_IMAGE must be set}
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    # The Nginx master starts as root and switches its workers to the nginx user.
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - frontend
      - ingress
      - proxy
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The public entry: HTTPS for app.wispmoney.com and wispmoney.com (ops/Caddyfile), proxied to web.
  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    <<: *no-new-privileges
    cap_drop: [ALL]
    # The caddy binary carries the capability to bind ports 80 and 443 and cannot start without it.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # The directory, not the file: install.sh replaces the file, which a single-file mount would not see.
      - ./caddy:/etc/caddy:ro
      # Certificates and ACME account keys. Losing them means asking Let's Encrypt again, within its rate limits.
      - wisp_production_caddy_data:/data
      - wisp_production_caddy_config:/config
    networks:
      proxy:
        # Web's Nginx trusts X-Forwarded-For only from this address.
        ipv4_address: 10.213.47.2
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  default: {}
  frontend:
    internal: true
  ingress: {}
  # Joins web and Caddy. The fixed subnet gives Caddy a static address outside the dynamic range,
  # the only address web's Nginx trusts for X-Forwarded-For.
  proxy:
    ipam:
      config:
        - subnet: 10.213.47.0/28
          gateway: 10.213.47.1
          ip_range: 10.213.47.8/29

volumes:
  wisp_production_postgres_data:
  wisp_production_caddy_data:
  wisp_production_caddy_config:
