name: tempo-staging

services:
    postgres:
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME must be set}
            POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD must be set}
            POSTGRES_DB: ${STAGING_DB_NAME:?STAGING_DB_NAME must be set}
        volumes:
            - tempo_staging_postgres_data:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 12
        mem_limit: 512m
        cpus: 1.0
        pids_limit: 256
        logging: &default-logging
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    redis:
        image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--save',
                '',
                '--appendonly',
                'no',
                '--maxmemory',
                '128mb',
                '--maxmemory-policy',
                'noeviction',
            ]
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 12
        mem_limit: 128m
        cpus: 0.25
        pids_limit: 128
        security_opt:
            - no-new-privileges:true
        logging: *default-logging

    mailpit:
        image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
        restart: unless-stopped
        # The web UI is published on loopback so staging emails can be read. The API reaches
        # SMTP over edge; Mailpit stays off backend so it has no route to postgres or redis.
        ports:
            - '127.0.0.1:8125:8025'
        environment:
            MP_DISABLE_VERSION_CHECK: 'true'
        networks:
            - edge
            - ingress
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 5s
            retries: 12
        mem_limit: 128m
        cpus: 0.25
        pids_limit: 128
        security_opt:
            - no-new-privileges:true
        logging: *default-logging

    api:
        image: ${TEMPO_API_IMAGE:?TEMPO_API_IMAGE must be set to an immutable digest}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            WEB_BASE_URL: http://127.0.0.1:8119
            API_URL: http://api:3000
            PORT: '3000'
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME must be set}
            DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD must be set}
            DB_NAME: ${STAGING_DB_NAME:?STAGING_DB_NAME must be set}
            DB_SYNCHRONIZE: 'false'
            DB_PGADMIN_PORT: '0'
            REDIS_URL: redis://redis:6379
            REDIS_PORT: '6379'
            REDIS_HOST: redis
            REDIS_INSIGHT_PORT: '0'
            SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
            SESSION_EXPIRATION: 30d
            SESSION_REDIS_KEY: tempo-staging-session
            AI_CATEGORIZATION_ENABLED: 'false'
            AI_CATEGORIZATION_PROVIDER: claude
            AI_CATEGORIZATION_MODEL: claude-opus-5-5
            AI_CATEGORIZATION_WEB_SEARCH_ENABLED: 'false'
            BANKING_INTEGRATION_ENABLED: 'false'
            ENABLE_BANKING_API_URL: https://disabled.invalid
            ENABLE_BANKING_APPLICATION_ID: tempo-staging-disabled
            ENABLE_BANKING_REDIRECT_URL: http://127.0.0.1:8119/bank-connections/callback
            BANKING_SESSION_ENCRYPTION_KEY_B64: ${BANKING_SESSION_ENCRYPTION_KEY_B64:?BANKING_SESSION_ENCRYPTION_KEY_B64 must be set}
            BANKING_SYNC_INTERVAL: 6h
            BANKING_SYNC_DISPATCH_INTERVAL: 10m
            BANKING_SYNC_RUNNING_TIMEOUT: 30m
            EMAIL_HOST: mailpit
            EMAIL_PORT: '1025'
            EMAIL_SECURE: 'false'
            EMAIL_UI_PORT: '8025'
            EMAIL_UI_URL: http://127.0.0.1:8125/
            EMAIL_VERIFICATION_EXPIRATION: 24h
            EMAIL_VERIFICATION_REDIS_KEY: tempo-staging-email-verification
            PASSWORD_RESET_EXPIRATION: 24h
            PASSWORD_RESET_REDIS_KEY: tempo-staging-password-reset
            THROTTLE_TTL: 1m
            THROTTLE_LIMIT: '100'
        expose:
            - '3000'
        networks:
            - backend
            - edge
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s
        mem_limit: 768m
        cpus: 1.0
        pids_limit: 256
        security_opt:
            - no-new-privileges:true
        logging: *default-logging

    web:
        image: ${TEMPO_WEB_IMAGE:?TEMPO_WEB_IMAGE must be set to an immutable digest}
        restart: unless-stopped
        ports:
            - '127.0.0.1:8119:8080'
        networks:
            - edge
            - ingress
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 5s
        mem_limit: 128m
        cpus: 0.25
        pids_limit: 128
        security_opt:
            - no-new-privileges:true
        logging: *default-logging

volumes:
    tempo_staging_postgres_data:
        name: tempo-staging-postgres-data

networks:
    backend:
        name: tempo-staging-backend
        internal: true
    edge:
        name: tempo-staging-edge
        internal: true
    ingress:
        name: tempo-staging-ingress
