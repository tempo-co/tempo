# Gives production Tempo its own tailnet device (https://tempo.<tailnet>.ts.net) so it
# does not share a browser origin with other apps served from the host's address.
# Installed to /etc/tempo/compose/tailscale.compose.yml by `ops/install.sh production`; the serve config
# stays on the host. The node is logged in once and keeps its identity in the state volume, so no
# auth key is passed after that. Separate project, so production deploys never recreate it
# unless its pinned image changes.
name: tempo-tailscale

services:
  tailscale:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    hostname: tempo
    restart: unless-stopped
    environment:
      TS_HOSTNAME: tempo
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'true'
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tempo_tailscale_state:/var/lib/tailscale
      - /etc/tempo/tailscale-serve.json:/config/serve.json:ro
    networks:
      tailscale:
        # Web's Nginx trusts X-Forwarded-For only from this address.
        ipv4_address: 10.213.47.2
    # Fails until the node is logged in and running.
    healthcheck:
      test: ['CMD', 'tailscale', 'status', '--peers=false']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

networks:
  tailscale:
    name: tempo-api-production_tailscale
    external: true

volumes:
  tempo_tailscale_state:
