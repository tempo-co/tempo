version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node types on the runtime major (Node 22 in the Dockerfile and CI).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Nest 12 waits until @nest-lab/throttler-storage-redis accepts it as a peer.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # connect-redis 9+ dropped ioredis, which the session store uses.
      - dependency-name: connect-redis
        update-types: ['version-update:semver-major']

  # Compose images are pinned by tag@digest; the production deploy rolls a changed pin out.
  - package-ecosystem: docker-compose
    directories: [/, /ops, /ops/staging]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One PR per image across dev, test, staging and production.
      compose-images:
        group-by: dependency-name
    ignore:
      # Major upgrades are planned by hand: PostgreSQL needs a dump and restore.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
