name: CI/CD

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-format:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run lint check
              run: npm run lint:check

            - name: Run format check
              run: npm run format:check

            - name: Install MCP dependencies
              run: NODE_ENV=development npm --prefix mcp ci --include=dev

            - name: Check MCP lint and format
              run: npm --prefix mcp run lint:check && npm --prefix mcp run format:check

            - name: Check deploy scripts
              run: |
                  shellcheck -x ops/deploy.sh ops/install.sh ops/backup.sh ops/targets/*.env ops/staging/tempo-staging-refresh.sh ops/ghcr-retention.sh ops/sync-pins.sh
                  export TEMPO_API_IMAGE=api TEMPO_WEB_IMAGE=web DB_USERNAME=u DB_PASSWORD=p DB_NAME=d TEMPO_PRODUCTION_ENV_FILE=/dev/null ENABLE_BANKING_PRIVATE_KEY_HOST_PATH=/dev/null TEMPO_CLAUDE_BRIDGE_DIR=/tmp
                  docker compose -f docker-compose.production.yml config -q
                  docker compose -f ops/staging/docker-compose.yml --env-file ops/staging/staging.env.example config -q

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

            - name: Build local MCP package
              run: NODE_ENV=development npm --prefix mcp ci --include=dev && npm --prefix mcp run build

    unit-test:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test

            - name: Run Claude bridge tests
              run: node --test ops/claude-bridge/*.test.mjs

            - name: Test local MCP package and stdio transport
              run: NODE_ENV=development npm --prefix mcp ci --include=dev && npm --prefix mcp test

    e2e-test:
        name: E2E Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run E2E tests
              run: npm run test:e2e:cov

    image:
        name: Image
        runs-on: ubuntu-latest
        needs: [lint-format]
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/tempo-api
            SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            # Same-repo PRs and main pushes publish; fork and Dependabot PRs only build.
            PUSH: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container registry
              if: env.PUSH == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: tags
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  {
                      echo 'tags<<EOF'
                      echo "$IMAGE:sha-$SOURCE_SHA"
                      if [[ -n "$PR_NUMBER" ]]; then echo "$IMAGE:pr-$PR_NUMBER"; fi
                      echo EOF
                  } >> "$GITHUB_OUTPUT"

            # The Dockerfile runs the runtime smoke check, so a successful build is a smoke-tested image.
            - name: Build, smoke-test and publish image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  push: ${{ env.PUSH == 'true' }}
                  tags: ${{ steps.tags.outputs.tags }}
                  cache-from: type=gha
                  cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || 'type=gha,mode=min' }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

    release:
        name: Release main image
        runs-on: ubuntu-latest
        concurrency:
            group: release
            cancel-in-progress: false
        needs: [lint-format, build, unit-test, e2e-test, image]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/tempo-api
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Retag the tested image without rebuilding, so production runs exactly what was tested.
            - name: Tag tested image as main
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  # Skip if a newer commit has landed on main since this run started, so :main never moves backwards.
                  if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
                      echo "main has moved on; not tagging $GITHUB_SHA"
                      exit 0
                  fi
                  docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:sha-$GITHUB_SHA"
