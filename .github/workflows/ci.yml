name: CI/CD

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are gated with `if:` on the paths a change touches, never with `on: paths:`: a skipped
# job reports success, while a skipped workflow leaves a required check pending. `CI` is the
# only required check.
jobs:
    changes:
        name: Changes
        runs-on: ubuntu-latest
        outputs:
            api: ${{ steps.paths.outputs.api }}
            web: ${{ steps.paths.outputs.web }}
            ops: ${{ steps.paths.outputs.ops }}
            e2e: ${{ steps.paths.outputs.e2e }}
            corpus: ${{ steps.paths.outputs.corpus }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # A PR compares its merge commit with the base branch (the merge commit's first parent).
            # A push to main compares each app with the commit its current `:main` image was built
            # from, so a change whose release was skipped (a newer commit released that app first) is
            # still released by the next push; ops compares with the previous main. When a base is unknown, the area runs.
            - name: Detect changed areas
              id: paths
              env:
                  BEFORE: ${{ github.event.before }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  set -euo pipefail
                  # Everything runs when CI itself changes.
                  shared='^\.github/(workflows/ci\.yml|scripts/)'
                  # Usage: touched <base commit or empty> <path regex>
                  touched() {
                      local files
                      if [[ -z $1 || $1 =~ ^0+$ ]] || ! git cat-file -e "$1^{commit}" 2>/dev/null; then
                          echo true
                          return
                      fi
                      files=$(git diff --name-only "$1" HEAD)
                      if grep -qE "$shared|$2" <<<"$files"; then echo true; else echo false; fi
                  }
                  if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
                      base=$(git rev-parse HEAD^1)
                      api_base=$base web_base=$base ops_base=$base
                  else
                      api_base=$(.github/scripts/released-revision.sh "$OWNER/api" main) || api_base=''
                      web_base=$(.github/scripts/released-revision.sh "$OWNER/web" main) || web_base=''
                      ops_base=$BEFORE
                  fi
                  echo "bases: api=${api_base:-unknown} web=${web_base:-unknown} ops=${ops_base:-unknown}"
                  # Both apps compile the shared contracts package into their images.
                  api=$(touched "$api_base" '^(apps/api|packages/contracts)/|^\.dockerignore$')
                  web=$(touched "$web_base" '^(apps/web|packages/contracts)/|^\.dockerignore$')
                  ops=$(touched "$ops_base" '^ops/')
                  # The real-file corpus check reads what the import readers and the bank list decide.
                  corpus=$(touched "$api_base" '^apps/api/src/app/modules/file-import/|^apps/api/test/corpus/|^packages/contracts/src/banks\.ts$')
                  e2e=false
                  if [[ $api == true || $web == true ]]; then e2e=true; fi
                  printf 'api=%s\nweb=%s\nops=%s\ne2e=%s\ncorpus=%s\n' "$api" "$web" "$ops" "$e2e" "$corpus" | tee -a "$GITHUB_OUTPUT"

    # Not gated: every change can touch a living doc or a path one names.
    docs:
        name: Docs check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x

            - name: Test the docs check
              run: node --test .github/scripts/check-docs.test.mjs

            - name: Check living docs
              run: node .github/scripts/check-docs.mjs

    ops:
        name: Ops checks
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.ops == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Check deploy scripts and Compose files
              run: |
                  shellcheck -x ops/deploy.sh ops/install.sh ops/backup.sh ops/targets/*.env ops/staging/tempo-staging-refresh.sh ops/ghcr-retention.sh ops/sync-pins.sh ops/wisp-api-egress.sh ops/restore-drill.sh ops/failure-email.sh ops/wisp-staging-copy.sh ops/wisp-staging-copy-serve.sh ops/wizard.sh ops/release-trigger.sh ops/test-deploy.sh ops/test-sync-pins.sh ops/test-backup.sh ops/test-release-trigger.sh .github/scripts/move-tag.sh .github/scripts/move-tag.test.sh .github/scripts/released-revision.sh
                  export TEMPO_API_IMAGE=api TEMPO_WEB_IMAGE=web DB_USERNAME=u DB_PASSWORD=p DB_NAME=d WISP_PRODUCTION_ENV_FILE=/dev/null ENABLE_BANKING_PRIVATE_KEY_HOST_PATH=/dev/null
                  docker compose -f ops/production.compose.yml config -q
                  docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" "$(docker compose -f ops/production.compose.yml config --images caddy)" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
                  docker compose -f ops/staging/docker-compose.yml --env-file ops/staging/staging.env.example config -q
                  docker compose -f ops/staging/tailscale.compose.yml config -q

            # Offline: stub docker, curl, restic and mail (or the registry) in a temporary sandbox; no daemon,
            # registry, repository or mail provider is used.
            - name: Test deploy and backup scripts
              run: |
                  ops/test-deploy.sh
                  ops/test-sync-pins.sh
                  ops/test-backup.sh
                  ops/test-release-trigger.sh
                  .github/scripts/move-tag.test.sh

    api-lint-format:
        name: API lint & format
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.api == 'true'
        defaults:
            run:
                working-directory: apps/api
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint check
              run: npm run lint:check

            - name: Run format check
              run: npm run format:check

    api-build:
        name: API build
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.api == 'true'
        defaults:
            run:
                working-directory: apps/api
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

    api-unit-test:
        name: API unit tests
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.api == 'true'
        defaults:
            run:
                working-directory: apps/api
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test

    # Reads tempo-co/tempo-import-corpus with a read-only deploy key. Fork and Dependabot PRs get no
    # secret, so the job reports a skip there; any other run without the key fails. Every step after
    # the two key checks runs only with the key. Its output is counts and failing file ids, never rows.
    api-corpus-check:
        name: API real-file corpus
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.corpus == 'true'
        env:
            HAS_KEY: ${{ secrets.CORPUS_DEPLOY_KEY != '' }}
            NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        defaults:
            run:
                working-directory: apps/api
        steps:
            - name: Report a fork or Dependabot run
              if: env.HAS_KEY != 'true' && env.NO_SECRETS == 'true'
              working-directory: .
              run: |
                  echo "::notice::Real-file corpus check skipped: fork and Dependabot PRs get no CORPUS_DEPLOY_KEY."

            - name: Require the corpus key
              if: env.HAS_KEY != 'true' && env.NO_SECRETS != 'true'
              working-directory: .
              run: |
                  echo "::error::The secret CORPUS_DEPLOY_KEY is missing, so the real-file corpus cannot be read."
                  exit 1

            - name: Checkout repository
              if: env.HAS_KEY == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Checkout corpus
              if: env.HAS_KEY == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: tempo-co/tempo-import-corpus
                  ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
                  persist-credentials: false
                  path: corpus

            - name: Setup Node.js 26.x
              if: env.HAS_KEY == 'true'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              if: env.HAS_KEY == 'true'
              run: npm ci

            - name: Run the corpus check
              if: env.HAS_KEY == 'true'
              env:
                  TEMPO_IMPORT_CORPUS: ${{ github.workspace }}/corpus
              run: npm run test:corpus

    api-e2e-test:
        name: API E2E tests
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.api == 'true'
        defaults:
            run:
                working-directory: apps/api
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/api/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run E2E tests
              run: npm run test:e2e:cov

    api-image:
        name: API image
        runs-on: ubuntu-latest
        needs: [changes, api-lint-format]
        if: needs.changes.outputs.api == 'true'
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.image }}
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/api
            SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            # Same-repo PRs and main pushes publish; fork and Dependabot PRs only build.
            PUSH: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container registry
              if: env.PUSH == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: tags
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  {
                      echo 'tags<<EOF'
                      echo "$IMAGE:sha-$SOURCE_SHA"
                      if [[ -n "$PR_NUMBER" ]]; then echo "$IMAGE:pr-$PR_NUMBER"; fi
                      echo EOF
                  } >> "$GITHUB_OUTPUT"

            # The Dockerfile runs the runtime smoke check, so a successful build is a smoke-tested image.
            # An image that is not published is saved for this run's web E2E instead.
            - name: Build, smoke-test and publish image
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: ${{ env.PUSH == 'true' }}
                  outputs: ${{ env.PUSH != 'true' && format('type=docker,dest={0}/api-image.tar', runner.temp) || '' }}
                  tags: ${{ steps.tags.outputs.tags }}
                  cache-from: type=gha,scope=api
                  cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=api,mode=max' || 'type=gha,scope=api,mode=min' }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

            - name: Image for web E2E
              id: image
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  if [[ $PUSH == true ]]; then
                      echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
                  else
                      echo "image=$IMAGE:sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
                  fi

            - name: Save unpublished image for web E2E
              if: env.PUSH != 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: api-image
                  path: ${{ runner.temp }}/api-image.tar
                  retention-days: 1
                  if-no-files-found: error

    web-lint-format:
        name: Web lint & format
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.web == 'true'
        defaults:
            run:
                working-directory: apps/web
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate routes
              run: npm run generate-routes

            - name: Run lint check
              run: npm run lint:check

            - name: Run format check
              run: npm run format:check

    web-build:
        name: Web build
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.web == 'true'
        defaults:
            run:
                working-directory: apps/web
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

            - name: Check entry JavaScript size
              run: node scripts/check-entry-size.mjs dist

            - name: Probe Nginx security headers
              run: bash scripts/tempo-web-security-headers-test.sh

    # Web E2E runs whenever either app changed: against this run's API image when the API
    # changed, otherwise against API main. An API-only change runs Chromium only; WebKit
    # catches browser-engine differences, which only a web change can introduce.
    web-e2e-shards:
        name: Web E2E shard ${{ matrix.shard }}/${{ matrix.total }}
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: [changes, api-image]
        if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && (needs.api-image.result == 'success' || (needs.api-image.result == 'skipped' && needs.changes.outputs.api != 'true')) }}
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
                total: [8]
        defaults:
            run:
                working-directory: apps/web
        env:
            API_CHANGED: ${{ needs.changes.outputs.api }}
            WEB_CHANGED: ${{ needs.changes.outputs.web }}
            API_IMAGE: ${{ needs.api-image.outputs.image }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Download this run's unpublished API image
              if: env.API_CHANGED == 'true' && !contains(env.API_IMAGE, '@sha256:')
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: api-image
                  path: ${{ runner.temp }}

            - name: Select API image
              id: api-image
              env:
                  ARCHIVE: ${{ runner.temp }}/api-image.tar
              run: |
                  set -euo pipefail
                  if [[ $API_CHANGED == true && -f $ARCHIVE ]]; then
                      docker load --input "$ARCHIVE"
                      image=$API_IMAGE
                      source='this run (not published)'
                  else
                      if [[ $API_CHANGED == true ]]; then
                          ref=$API_IMAGE
                          source='this run'
                      else
                          ref=ghcr.io/tempo-co/api:main
                          source='main'
                      fi
                      docker pull "$ref"
                      image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep -m1 '^ghcr.io/tempo-co/api@sha256:')
                  fi
                  revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
                  echo "image=$image" >> "$GITHUB_OUTPUT"
                  echo "API image from $source: \`$image\` (revision \`$revision\`)" >> "$GITHUB_STEP_SUMMARY"

            # Start the services now and wait for them later, so they boot while dependencies install.
            - name: Start Docker E2E environment
              env:
                  TEMPO_API_E2E_IMAGE: ${{ steps.api-image.outputs.image }}
              run: docker compose -f docker-compose.e2e.yml up -d

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/web/package-lock.json

            - name: Install npm dependencies
              run: npm ci

            # The official image ships the browsers and their system packages for this exact
            # Playwright version, so no shard installs them from Ubuntu mirrors.
            - name: Pull Playwright image
              id: playwright
              run: |
                  set -euo pipefail
                  version=$(node -p "require('@playwright/test/package.json').version")
                  image="mcr.microsoft.com/playwright:v${version}-noble"
                  docker pull --quiet "$image"
                  echo "image=$image" >> "$GITHUB_OUTPUT"

            - name: Wait for and seed Docker E2E environment
              env:
                  TEMPO_API_E2E_IMAGE: ${{ steps.api-image.outputs.image }}
              run: |
                  docker compose -f docker-compose.e2e.yml up -d --wait
                  npm run db:seed:e2e

            # Runs in the Playwright image on the host network, so the app, the API and Mailpit
            # keep their localhost origins. The job's Node is mounted in, so the build and the
            # runner use the version the app requires rather than the image's own.
            - name: Run E2E tests
              env:
                  PLAYWRIGHT_IMAGE: ${{ steps.playwright.outputs.image }}
                  SHARD: ${{ matrix.shard }}/${{ matrix.total }}
              run: |
                  set -euo pipefail
                  if [[ $WEB_CHANGED == true ]]; then set --; else set -- --project=chromium; fi
                  node_home=$(dirname "$(dirname "$(command -v node)")")
                  docker run --rm --network host --ipc host \
                      --user "$(id -u):$(id -g)" \
                      -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
                      -v "$node_home:/opt/node:ro" \
                      -e PATH="/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
                      -e HOME=/tmp -e CI \
                      -e VITE_API_URL=http://localhost:3000 \
                      -e VITE_APP_URL=http://localhost:5173 \
                      -e VITE_EMAIL_UI_URL=http://localhost:8025 \
                      "$PLAYWRIGHT_IMAGE" \
                      npx playwright test --shard="$SHARD" --reporter=list,blob "$@"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-blob-${{ matrix.shard }}
                  path: apps/web/blob-report/
                  retention-days: 1
                  overwrite: true
                  if-no-files-found: error

    web-e2e-test:
        name: Web E2E tests
        needs: [web-e2e-shards]
        if: ${{ !cancelled() && needs.web-e2e-shards.result != 'skipped' }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/web
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js 26.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26.x
                  cache: 'npm'
                  cache-dependency-path: apps/web/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Download shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: playwright-blob-*
                  path: apps/web/all-blob-reports
                  merge-multiple: true

            - name: Merge Playwright report
              env:
                  PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
              run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

            # Retries keep the job green when a test fails and then passes, so list those tests where they are seen.
            - name: List flaky tests
              continue-on-error: true
              run: node scripts/list-flaky-tests.mjs merged-report.json >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: playwright-report
                  path: apps/web/playwright-report/
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: error

            - name: Require every shard to pass
              if: ${{ always() }}
              env:
                  SHARDS_RESULT: ${{ needs.web-e2e-shards.result }}
              run: test "$SHARDS_RESULT" = success

    web-image:
        name: Web image
        runs-on: ubuntu-latest
        needs: [changes, web-lint-format]
        if: needs.changes.outputs.web == 'true'
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/web
            SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
            # Same-repo PRs and main pushes publish; fork and Dependabot PRs only build.
            PUSH: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container registry
              if: env.PUSH == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: tags
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  {
                      echo 'tags<<EOF'
                      echo "$IMAGE:sha-$SOURCE_SHA"
                      if [[ -n "$PR_NUMBER" ]]; then echo "$IMAGE:pr-$PR_NUMBER"; fi
                      echo EOF
                  } >> "$GITHUB_OUTPUT"

            - name: Build and publish image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: apps/web/Dockerfile.production
                  push: ${{ env.PUSH == 'true' }}
                  tags: ${{ steps.tags.outputs.tags }}
                  cache-from: type=gha,scope=web
                  cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=web,mode=max' || 'type=gha,scope=web,mode=min' }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

    ci:
        # The only required check. Skipped jobs are fine; a failed or cancelled one fails CI.
        name: CI
        runs-on: ubuntu-latest
        needs:
            [changes, docs, ops, api-lint-format, api-build, api-unit-test, api-corpus-check, api-e2e-test, api-image, web-lint-format, web-build, web-e2e-shards, web-e2e-test, web-image]
        if: ${{ always() }}
        steps:
            - name: Require every needed job to pass or be skipped
              env:
                  RESULTS: ${{ toJSON(needs.*.result) }}
              run: |
                  echo "$RESULTS"
                  jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS" >/dev/null

    release:
        name: Release main images
        runs-on: ubuntu-latest
        concurrency:
            group: release
            cancel-in-progress: false
        needs: [changes, ci]
        # `!cancelled()` stops the jobs `ci` skipped by design from skipping this one too.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.ci.result == 'success' }}
        permissions:
            contents: read
            packages: write
        env:
            API_CHANGED: ${{ needs.changes.outputs.api }}
            WEB_CHANGED: ${{ needs.changes.outputs.web }}
            OWNER: ${{ github.repository_owner }}
        steps:
            # Full history, so the commit each `:main` image was built from can be compared with this one.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Retag the tested images without rebuilding, so what is released is exactly what was tested.
            # Only apps this commit changed are retagged; API first, so web never moves ahead of it.
            # Each app's `:main` moves only forward (.github/scripts/move-tag.sh).
            - name: Tag tested images as main
              run: |
                  set -euo pipefail
                  for app in api web; do
                      changed_var=${app^^}_CHANGED
                      if [[ ${!changed_var} != true ]]; then
                          echo "$app unchanged; its main tag stays"
                          continue
                      fi
                      .github/scripts/move-tag.sh "$OWNER/$app" main "$GITHUB_SHA"
                  done
