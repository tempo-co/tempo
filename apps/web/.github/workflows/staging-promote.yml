name: Promote staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number whose exact head should be promoted
        required: true
        type: number

permissions:
  contents: read

jobs:
  validate:
    name: Validate selected PR head
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Validate PR head and terminal checks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pr="$PR_NUMBER"
          [[ "$GITHUB_REF" == refs/heads/main ]]
          pr_json="$(gh api "repos/$repo/pulls/$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          state="$(jq -r '.state // ""' <<<"$pr_json")"
          merged_at="$(jq -r '.merged_at // ""' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"

          [[ "$repo" == tempo-co/tempo-web ]]
          [[ "$head_repo" == "$repo" ]]
          [[ "$base_ref" == main ]]
          [[ "$draft" == false ]]
          if [[ "$state" != open && ( "$state" != closed || -z "$merged_at" ) ]]; then
            exit 1
          fi
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          main_ci_sha="$(gh api "repos/$repo/contents/.github/workflows/ci.yml?ref=main" --jq '.sha')"
          head_ci_sha="$(gh api "repos/$repo/contents/.github/workflows/ci.yml?ref=$head_sha" --jq '.sha')"
          [[ "$head_ci_sha" == "$main_ci_sha" ]]

          runs_json="$(gh api --paginate "repos/$repo/actions/runs?head_sha=$head_sha&per_page=100" --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}')"
          trusted_run_json="$(jq -c --arg head_sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $head_sha and .path == ".github/workflows/ci.yml" and .check_suite_id != null)] | max_by(.id) // empty' <<<"$runs_json")"
          [[ -n "$trusted_run_json" ]]
          [[ "$(jq -r '.status' <<<"$trusted_run_json")" == completed ]]
          [[ "$(jq -r '.conclusion' <<<"$trusted_run_json")" == success ]]
          trusted_suite_id="$(jq -r '.check_suite_id' <<<"$trusted_run_json")"

          checks_json="$(gh api --paginate "repos/$repo/commits/$head_sha/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}')"
          statuses_json="$(gh api --paginate "repos/$repo/commits/$head_sha/status?per_page=100" --jq '.statuses[]' | jq -s '{statuses: .}')"
          check_count="$(jq --argjson suite_id "$trusted_suite_id" '[.check_runs[] | select(.check_suite.id == $suite_id)] | length' <<<"$checks_json")"
          failed_checks="$(jq --argjson suite_id "$trusted_suite_id" '[.check_runs[] | select(.check_suite.id == $suite_id and (.status != "completed" or (.conclusion | IN("success", "neutral", "skipped") | not)))] | length' <<<"$checks_json")"
          failed_statuses="$(jq '[.statuses[] | select(.state != "success")] | length' <<<"$statuses_json")"
          missing_checks="$(jq -r --argjson suite_id "$trusted_suite_id" --argjson required '["Lint & Format", "Build", "E2E Tests"]' '[ $required[] as $name | select(([.check_runs[] | select(.check_suite.id == $suite_id and .name == $name and .status == "completed" and .conclusion == "success")] | length) == 0) | $name ] | join(",")' <<<"$checks_json")"

          (( check_count > 0 ))
          (( failed_checks == 0 ))
          (( failed_statuses == 0 ))
          [[ -z "$missing_checks" ]]
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    name: Build exact PR image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck source quality
        run: |
          npm run generate-routes
          npm run lint:check
          npm run format:check
          npm run build

      - name: Build image without registry credentials
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.head_sha }}
        run: |
          set -euo pipefail
          docker build --pull --file Dockerfile.production --tag "tempo-promote-web:${SOURCE_SHA}" .
          docker save "tempo-promote-web:${SOURCE_SHA}" | gzip > "$RUNNER_TEMP/tempo-web-image.tar.gz"

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tempo-web-image-${{ needs.validate.outputs.head_sha }}
          path: ${{ runner.temp }}/tempo-web-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved staging image and intent
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: staging
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tempo-web-image-${{ needs.validate.outputs.head_sha }}
          path: ${{ runner.temp }}/tempo-web-image

      - name: Load exact build artifact
        run: gzip -dc "$RUNNER_TEMP/tempo-web-image/tempo-web-image.tar.gz" | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish PR-head image and resolve digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.head_sha }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/tempo-web:staging-${{ github.run_id }}-${{ needs.validate.outputs.head_sha }}
        run: |
          set -euo pipefail
          docker tag "tempo-promote-web:${SOURCE_SHA}" "${IMAGE_TAG}"
          docker push "${IMAGE_TAG}"
          digest="$(docker manifest inspect --verbose "${IMAGE_TAG}" | jq -r 'if type == "array" then .[0].Descriptor.digest else .Descriptor.digest end')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_ref=ghcr.io/%s/tempo-web@%s\n' "${GITHUB_REPOSITORY_OWNER}" "$digest" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create successful staging deployment intent
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          payload="$(jq -n \
            --arg repository "$repo" \
            --arg component web \
            --arg environment staging \
            --arg head_sha "$HEAD_SHA" \
            --arg image "$IMAGE_REF" \
            --arg image_tag "$IMAGE_TAG" \
            --argjson pr_number "$PR_NUMBER" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg dispatch_sha "$GITHUB_SHA" \
            '{schema_version: 1, repository: $repository, component: $component, environment: $environment, pr_number: $pr_number, head_sha: $head_sha, image: $image, image_tag: $image_tag, workflow: {path: ".github/workflows/staging-promote.yml", ref: "refs/heads/main", event: "workflow_dispatch", run_id: $run_id, dispatch_sha: $dispatch_sha}}')"
          deployment_body="$(jq -n \
            --arg ref "$HEAD_SHA" \
            --argjson payload "$payload" \
            '{ref: $ref, task: "deploy", auto_merge: false, required_contexts: [], environment: "staging", description: "Protected staging promotion for the exact selected PR head", payload: $payload, transient_environment: false, production_environment: false}')"
          deployment_id="$(printf '%s' "$deployment_body" | gh api --method POST "repos/$repo/deployments" --input - --jq '.id')"
          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          status_body="$(jq -n \
            --arg log_url "$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", log_url: $log_url, description: "Immutable staging image published and ready for host reconciliation"}')"
          printf '%s' "$status_body" | gh api --method POST "repos/$repo/deployments/$deployment_id/statuses" --input - >/dev/null
