name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Run lint check
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

      - name: Test staging promotion workflow contract
        run: bash ops/tests/tempo-staging-promotion-workflow-test.sh

      - name: Test E2E startup readiness contract
        run: bash ops/tests/tempo-web-e2e-environment-test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Build application
        run: npm run build

  e2e-test:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout web repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate immutable API E2E image
        shell: bash
        env:
          TEMPO_API_E2E_IMAGE: ${{ vars.TEMPO_API_E2E_IMAGE }}
        run: |
          test -n "${TEMPO_API_E2E_IMAGE:-}"
          [[ "$TEMPO_API_E2E_IMAGE" =~ ^ghcr\.io/tempo-co/tempo-api@sha256:[0-9a-f]{64}$ ]]

      - name: Log in to GitHub Container Registry for the API E2E image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull immutable API E2E image and clear registry credentials
        env:
          TEMPO_API_E2E_IMAGE: ${{ vars.TEMPO_API_E2E_IMAGE }}
        run: |
          set -euo pipefail
          docker pull "$TEMPO_API_E2E_IMAGE"
          docker logout ghcr.io

      - name: Setup Docker E2E environment
        env:
          TEMPO_API_E2E_IMAGE: ${{ vars.TEMPO_API_E2E_IMAGE }}
        run: |
          docker compose -f docker-compose.e2e.yml up -d --wait
          npm run db:seed:e2e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          VITE_API_URL: http://localhost:3000
          VITE_APP_URL: http://localhost:5173
          VITE_EMAIL_UI_URL: http://localhost:8025
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tempo-web:latest
            ghcr.io/${{ github.repository_owner }}/tempo-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
