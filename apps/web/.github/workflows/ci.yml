name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` reruns CI when the PR body's Depends-on line changes.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Edits that don't touch the body get their own group so they can't cancel a running build.
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ (github.event.action == 'edited' && !github.event.changes.body) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Run lint check
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Build application
        run: npm run build

      - name: Probe Nginx security headers
        run: bash ops/tests/tempo-web-security-headers-test.sh

  e2e-test:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout web repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `Depends-on: tempo-api#<n>` in the PR body selects that open API PR's image; otherwise API main.
      - name: Select API image
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          tag=main
          api_pr=$(printf '%s\n' "${PR_BODY:-}" | tr -d '\r' | sed -nE '/^Depends-on:[[:space:]]*tempo-api#[1-9][0-9]*[[:space:]]*$/{s/^Depends-on:[[:space:]]*tempo-api#([0-9]+).*/\1/p;q}')
          if [[ -n "$api_pr" ]]; then
            state=$(gh api "repos/tempo-co/tempo-api/pulls/$api_pr" --jq .state) || { echo "::error::tempo-api#$api_pr not found"; exit 1; }
            if [[ "$state" == open ]]; then tag="pr-$api_pr"; fi
            echo "Depends-on tempo-api#$api_pr ($state)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry for the API E2E image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull API image and clear registry credentials
        id: api-image
        env:
          API_TAG: ${{ steps.api.outputs.tag }}
        run: |
          set -euo pipefail
          ref="ghcr.io/tempo-co/tempo-api:$API_TAG"
          if ! docker pull "$ref"; then
            docker logout ghcr.io
            echo "::error::$ref does not exist yet. Wait for the API PR's Image job, then rerun this job."
            exit 1
          fi
          docker logout ghcr.io
          image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep -m1 '^ghcr.io/tempo-co/tempo-api@sha256:')
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "API image: \`$ref\` = \`$image\` (revision \`$revision\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Docker E2E environment
        env:
          TEMPO_API_E2E_IMAGE: ${{ steps.api-image.outputs.image }}
        run: |
          docker compose -f docker-compose.e2e.yml up -d --wait
          npm run db:seed:e2e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          VITE_API_URL: http://localhost:3000
          VITE_APP_URL: http://localhost:5173
          VITE_EMAIL_UI_URL: http://localhost:8025
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [lint-format]
    if: github.event.pull_request.state != 'closed'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tempo-web
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Same-repo PRs and main pushes publish; fork and Dependabot PRs only build.
      PUSH: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:sha-$SOURCE_SHA"
            if [[ -n "$PR_NUMBER" ]]; then echo "$IMAGE:pr-$PR_NUMBER"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.production
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || 'type=gha,mode=min' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

  release:
    name: Release main image
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    needs: [e2e-test, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tempo-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retag the tested image without rebuilding, so production runs exactly what was tested.
      - name: Tag tested image as main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Skip if a newer commit has landed on main since this run started, so :main never moves backwards.
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "main has moved on; not tagging $GITHUB_SHA"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:sha-$GITHUB_SHA"
