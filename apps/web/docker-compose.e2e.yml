name: tempo-web

services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit_test
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis
    container_name: redis_test
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres
    container_name: postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tempo_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tempo_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: ${TEMPO_API_E2E_IMAGE:?TEMPO_API_E2E_IMAGE must be set to an explicit API image}
    pull_policy: never
    container_name: api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: test
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
