server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = /tempo {
        return 301 /tempo/;
    }

    location = /tempo/mailpit {
        return 301 /tempo/mailpit/;
    }

    location = /staging {
        return 301 /staging/;
    }

    location = /staging/mailpit {
        return 301 /staging/mailpit/;
    }

    location = /mailpit {
        return 301 /tempo/mailpit/;
    }

    location /tempo/mailpit/ {
        proxy_pass http://mailpit:8025/tempo/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /staging/mailpit/ {
        proxy_pass http://mailpit:8025/staging/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mailpit/ {
        proxy_pass http://mailpit:8025/tempo/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /tempo/bank-connections/callback {
        rewrite ^/tempo/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /staging/bank-connections/callback {
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /tempo/api {
        rewrite ^/tempo/api$ / break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /staging/api {
        rewrite ^/staging/api$ / break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tempo/api/ {
        rewrite ^/tempo/api/?(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /staging/api/ {
        rewrite ^/staging/api/?(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tempo/ {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        rewrite ^/tempo/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /staging/ {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        rewrite ^/staging/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    location / {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
