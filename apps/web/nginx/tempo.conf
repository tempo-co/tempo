server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    # Allow percent-encoded 1000-character Unicode searches in SPA and API request lines.
    large_client_header_buffers 4 16k;

    root /usr/share/nginx/html;

    # The host's HTTPS terminator reaches this listener through the container network gateway and sends the
    # client address in X-Forwarded-For. Use that address so the API sees the client instead of the gateway.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Inherited by every proxied location below (none sets its own proxy headers).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location = /bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
    }

    location = /api {
        proxy_pass http://api:3000/;
    }

    location /api/ {
        proxy_pass http://api:3000/;
    }

    location / {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
