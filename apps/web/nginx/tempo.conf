server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = /tempo {
        return 301 /tempo/;
    }

    location = /tempo/bank-connections/callback {
        rewrite ^/tempo/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /tempo/api {
        rewrite ^/tempo/api$ / break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tempo/api/ {
        rewrite ^/tempo/api/?(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tempo/ {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        rewrite ^/tempo/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
