server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    # Allow percent-encoded 1000-character Unicode searches in SPA and API request lines.
    large_client_header_buffers 4 16k;

    root /usr/share/nginx/html;

    # The Tailscale sidecar terminates HTTPS and sends the tailnet client address in X-Forwarded-For. Only
    # its static address on the production `tailscale` network (ops/production.compose.yml) is
    # trusted, so other local processes and containers cannot choose the client address the API sees.
    set_real_ip_from 10.213.47.2;
    real_ip_header X-Forwarded-For;

    # Inherited by every proxied location below (none sets its own proxy headers).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    location = /bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
    }

    location = /api {
        proxy_pass http://api:3000/;
    }

    location = /api/mcp {
        proxy_pass http://api:3000/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 100k;
    }

    location /api/ {
        proxy_pass http://api:3000/;
    }

    location / {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        # The app's own files only. API responses mix account data with request input, so compressing
        # them would expose them to BREACH-style length attacks.
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript image/svg+xml;
        try_files $uri $uri/ /index.html;
    }
}
