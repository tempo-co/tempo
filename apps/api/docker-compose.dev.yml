name: tempo-api-development

services:
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: mailpit
    ports:
      - target: ${EMAIL_PORT}
        published: "${EMAIL_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${EMAIL_PORT}
        published: "${EMAIL_PORT}"
        host_ip: "::1"
        protocol: tcp
      - target: ${EMAIL_UI_PORT}
        published: "${EMAIL_UI_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${EMAIL_UI_PORT}
        published: "${EMAIL_UI_PORT}"
        host_ip: "::1"
        protocol: tcp

  redis:
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    container_name: redis
    ports:
      - target: ${REDIS_PORT}
        published: "${REDIS_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${REDIS_PORT}
        published: "${REDIS_PORT}"
        host_ip: "::1"
        protocol: tcp

  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: always
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - target: ${DB_PORT}
        published: "${DB_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${DB_PORT}
        published: "${DB_PORT}"
        host_ip: "::1"
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
