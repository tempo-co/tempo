name: tempo-api-test

services:
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: mailpit_test
    ports:
      - target: ${EMAIL_PORT}
        published: "${EMAIL_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${EMAIL_PORT}
        published: "${EMAIL_PORT}"
        host_ip: "::1"
        protocol: tcp
      - target: ${EMAIL_UI_PORT}
        published: "${EMAIL_UI_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${EMAIL_UI_PORT}
        published: "${EMAIL_UI_PORT}"
        host_ip: "::1"
        protocol: tcp

  redis:
    image: redis:7.4.11@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    container_name: redis_test
    ports:
      - target: ${REDIS_PORT}
        published: "${REDIS_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${REDIS_PORT}
        published: "${REDIS_PORT}"
        host_ip: "::1"
        protocol: tcp

  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: postgres_test
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - target: ${DB_PORT}
        published: "${DB_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: ${DB_PORT}
        published: "${DB_PORT}"
        host_ip: "::1"
        protocol: tcp
